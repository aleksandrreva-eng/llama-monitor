[package]
name = "llama-monitor"
version = "0.1.0"
description = "llama.cpp server monitoring widget for Windows 11"
authors = ["aleksandrreva-eng"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.6", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
log = { version = "0.4", features = ["std"] }
chrono = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
